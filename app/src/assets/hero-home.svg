    <path fill="#d9b184" fill-opacity="0.10"
          d="M50 86 C24 64 8 48 8 30 C8 17 18 7 31 7 C40 7 47 12 50 19 C53 12 60 7 69 7 C82 7 92 17 92 30 C92 48 76 64 50 86 Z"/>
  </g>

  <g stroke="url(#arrowH)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M223 548 H332"/>
    <path d="M319 535 L332 548 L319 561"/>
  </g>

  <g class="breathe-b" stroke="#8fb48f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
     fill="#8fb48f" fill-opacity="0.10" transform="translate(432 548) scale(0.82) translate(-50 -47)">
    <path d="M48 12 C41 4 27 6 23 16 C13 18 8 28 13 36 C6 42 7 54 16 57 C17 67 29 72 38 66 C43 63 47 57 47 50 Z"/>
    <path d="M52 12 C59 4 73 6 77 16 C87 18 92 28 87 36 C94 42 93 54 84 57 C83 67 71 72 62 66 C57 63 53 57 53 50 Z"/>
    <g fill="none">
      <path d="M50 10 C49 24 49 38 50 52"/>
      <path d="M22 26 C28 22 34 24 36 30"/>
      <path d="M20 42 C27 37 35 39 37 46"/>
      <path d="M64 30 C66 24 72 22 78 26"/>
      <path d="M63 46 C65 39 73 37 80 42"/>
      <path d="M45 68 C43 76 41 80 37 84"/>
      <path d="M55 68 C57 76 59 80 63 84"/>
    </g>
  </g>
</svg>