<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="560" height="640" role="img"
     aria-label="I and 我 crossed out, becoming they / he / she and TA / 她 / 他; below, a heart becomes a brain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2621"/>
      <stop offset="0.55" stop-color="#22302a"/>
      <stop offset="1" stop-color="#2b3b31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb48f"/>
      <stop offset="1" stop-color="#d9b184"/>
    </linearGradient>
    <linearGradient id="arrowV" gradientUnits="userSpaceOnUse" x1="280" y1="198" x2="280" y2="260">
      <stop offset="0" stop-color="#8fb48f"/>
      <stop offset="1" stop-color="#d9b184"/>
    </linearGradient>
    <linearGradient id="arrowH" gradientUnits="userSpaceOnUse" x1="221" y1="548" x2="338" y2="548">
      <stop offset="0" stop-color="#d9b184"/>
      <stop offset="1" stop-color="#8fb48f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fb48f" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8fb48f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9b184" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#d9b184" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="panel">
      <rect x="1" y="1" width="558" height="638" rx="26"/>
    </clipPath>
    <style>
      .breathe-a { animation: breathe 5.5s ease-in-out infinite; }
      .breathe-b { animation: breathe 5.5s ease-in-out 2.75s infinite; }
      @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.74; } }
      @media (prefers-reduced-motion: reduce) {
        .breathe-a, .breathe-b { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="558" height="638" rx="26" fill="url(#bg)" stroke="#ffffff" stroke-opacity="0.09"/>
  <g clip-path="url(#panel)">
    <ellipse cx="280" cy="160" rx="250" ry="170" fill="url(#glowA)"/>
    <ellipse cx="360" cy="545" rx="220" ry="150" fill="url(#glowB)"/>
    <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
      <path d="M0 80 H560 M0 160 H560 M0 240 H560 M0 320 H560 M0 400 H560 M0 480 H560 M0 560 H560"/>
      <path d="M80 0 V640 M160 0 V640 M240 0 V640 M320 0 V640 M400 0 V640 M480 0 V640"/>
    </g>
  </g>

  <g text-anchor="middle"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="252" y="152" font-size="74" font-weight="600" fill="#5d7062">我</text>
    <text x="322" y="152" font-size="74" font-weight="600" fill="#5d7062">I</text>
    <line x1="203" y1="137" x2="345" y2="117" stroke="#5d7062" stroke-width="4.5"
          stroke-opacity="0.9" stroke-linecap="round"/>
  </g>

  <g stroke="url(#arrowV)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <path d="M280 200 V256"/>
    <path d="M267 243 L280 256 L293 243"/>
  </g>

  <g text-anchor="middle"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
    <text x="287" y="342" font-size="56" font-weight="600" letter-spacing="14" fill="url(#accent)">TA 她 他</text>
    <text x="280" y="396" font-size="27" letter-spacing="2.5" fill="#a7b6aa">they / he / she</text>
  </g>

  <line x1="120" y1="438" x2="440" y2="438" stroke="#ffffff" stroke-opacity="0.08"/>

  <g class="breathe-a" transform="translate(205 548) scale(0.76) translate(-50 -46.5)"
