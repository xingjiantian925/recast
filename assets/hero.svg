<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Recast — write it as yourself, read it as someone else">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="0.55" stop-color="#101733"/>
      <stop offset="1" stop-color="#161c3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#b98bff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <ellipse cx="600" cy="150" rx="420" ry="190" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200"/>
    <path d="M150 0 V360 M450 0 V360 M750 0 V360 M1050 0 V360"/>
  </g>

  <!-- pronoun motif: I -> he / she -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="392" y="118" font-size="46" font-weight="600" fill="#4d5880">I</text>
    <line x1="374" y1="128" x2="410" y2="88" stroke="#4d5880" stroke-width="3" stroke-opacity="0.85" stroke-linecap="round"/>

    <g stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
      <path d="M466 104 H546"/>
      <path d="M528 90 L546 104 L528 118"/>
    </g>

    <text x="668" y="118" font-size="46" font-weight="600" fill="url(#accent)">he</text>
    <text x="726" y="118" font-size="46" font-weight="600" fill="#6b76a3" opacity="0.55">/</text>
    <text x="784" y="118" font-size="46" font-weight="600" fill="url(#accent)">she</text>
  </g>

  <!-- wordmark -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="600" y="232" font-size="88" font-weight="700" letter-spacing="16" fill="#ffffff">RECAST</text>
    <text x="600" y="286" font-size="22" letter-spacing="1.5" fill="#95a0c6">Write it as yourself. Read it as someone else.</text>
  </g>

  <line x1="360" y1="318" x2="840" y2="318" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.5"/>
</svg>